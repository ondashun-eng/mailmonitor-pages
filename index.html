
<!DOCTYPE html>

<body>
  <h1>MailMonitor</h1>

  <p>
    MailMonitorは、複数のメールアカウントの受信メールを
    一つの画面で確認するための個人利用アプリケーションです。
  </p>

  <h2>主な機能</h2>
  <ul>
    <li>Gmail、Outlook、Yahoo、さくらのメール確認</li>
    <li>新着メールの定期取得</li>
    <li>受信メールの一覧・詳細表示</li>
  </ul>

  <h2>データの取り扱い</h2>
  <p>
    メール情報は利用者が管理するローカル環境に保存されます。
    本アプリケーションはメールの送信を行いません。
  </p>

  <p>
    <a href="privacy.html">プライバシーポリシー</a>
  </p>
</body>
</html>
